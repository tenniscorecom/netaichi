name: swap-court

on:
  schedule:
    # 毎時37分。空きは他人のキャンセル待ちなので早い者勝ち。
    # UTC 23時台（JST 8時台）は daily と重なるため外す。
    - cron: '37 0-22 * * *'
  workflow_dispatch:

concurrency:
  group: swap-court
  cancel-in-progress: false

jobs:
  swap:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      TZ: Asia/Tokyo

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: browser-actions/setup-chrome@v1

      - run: pip install poetry

      - run: poetry install --no-root

      # DBはリポジトリに含めていないため、ここではマスターの予約だけが対象になる。
      # 全アカウントを見たい場合はDBのあるローカルで実行する。
      - run: poetry run python -m netaichi swap --headless
        env:
          NETAICHI_DEFAULT_PW: ${{ secrets.NETAICHI_DEFAULT_PW }}
          OGURI_ACCOUNT_ID: ${{ secrets.OGURI_ACCOUNT_ID }}
          KOMADA_ACCOUNT_ID: ${{ secrets.KOMADA_ACCOUNT_ID }}
          OGURI_GSS_ID: ${{ secrets.OGURI_GSS_ID }}
          KOMADA_GSS_ID: ${{ secrets.KOMADA_GSS_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TENNISBEAR_EMAIL: ${{ secrets.TENNISBEAR_EMAIL }}
          TENNISBEAR_PW: ${{ secrets.TENNISBEAR_PW }}
          GSS_CREDENTIALS_JSON: ${{ secrets.GSS_CREDENTIALS_JSON }}
