# コート乗り換えの設定
#
# 抽選で当たったコートは番号を選べないため、予約済みの枠と同じ日時に
# より良い番号が空いていたら移動する。
#
# 良し悪しの基準は「隣のコートからボールが入ってこないか」（＝ブロックの端）。
# 隣がいると練習・レッスンの進行が止まる。次点で入口からの近さ。
#
# group:         対象アカウントグループ
# months_ahead:  何ヶ月先までの予約を対象にするか
# min_days_ahead: 今日から何日先以降の予約を対象にするか。
#                 ネットあいちの取消期限（前日15時）を過ぎていると取消だけ失敗し、
#                 移動先と元の2面を持ったままになる。手前の日は触らない。
# courts:       施設ごとの設定。キーはネットあいちの予約一覧に出る施設名
#   prefix:   コート名の接頭辞。「庭球場１」の「庭球場」の部分
#   priority: 上の行ほど優先度が高い。同じ行の中では同格。
#             ここに書かれていない番号は最下位扱いで、移動先には選ばない
group: oguri
months_ahead: 2
min_days_ahead: 2
courts:
  大高緑地:
    prefix: 庭球場
    # 1-3 / 4-6 / 7-10 / 11-14 の4ブロック。各ブロックの端は隣が片側だけで当たり。
    # 手前は 1-3 と 7-10 のブロック
    priority:
      - [1, 3, 7, 10]   # 端かつ手前
      - [4, 6, 11, 14]  # 端（奥）
      - [2, 8, 9]       # 手前だが真ん中
      - [5, 12, 13]     # 奥かつ真ん中
  愛・地球博記念公園:
    prefix: 庭球場
    # 庭球場は6面。1と6が端で、1のほうが入口に近い。
    # フットサル（A・B）への移動は未対応（reserve_available_slot が庭球場専用のため）
    priority:
      - [1]
      - [6]
      - [2, 3, 4, 5]
