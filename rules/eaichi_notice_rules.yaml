# 窓口でしか取り消せない施設の、取消期限前通知
#
# 日進市（えあいち）の上納池スポーツ公園はネットからキャンセルできず、
# 期限までに窓口へ行く必要がある。集客0のまま通知日になったら知らせる。
#
# courts: コート名(部分一致キー)ごとの設定
#   days_before:       レッスン日の何日前に通知するか（＝窓口へ行く日）
#   limit_days_before: 施設の取消期限（レッスン日の何日前まで）。案内文に出す
#   closed_weekday:    施設の休館日（0=月 … 6=日）。通知日が休館日なら前日にずらす
courts:
  上納池:
    days_before: 9
    limit_days_before: 8
    closed_weekday: 0
